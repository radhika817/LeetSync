<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetSync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo-title">
      <div class="badge">LS</div>
      <h2>LeetSync</h2>
    </div>
    <span class="status-indicator" id="connectionBadge">Disconnected</span>
  </div>

  <div class="container">
    <div id="authSection">
      <div class="form-group">
        <label for="ghToken">GitHub Personal Access Token (repo scope)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" />
        <small class="hint">Stored only in extension storage and read exclusively in the background.</small>
      </div>

      <div class="form-group">
        <label for="ghRepo">Repository (e.g. username/LeetCode-Solutions)</label>
        <input type="text" id="ghRepo" placeholder="octocat/leetcode-solutions" />
      </div>

      <button id="saveBtn" class="btn btn-primary">Save & Connect</button>
    </div>

    <div id="statusMessage" class="status-message hidden"></div>

    <div class="footer">
      <p>Solve on LeetCode &bull; Auto-sync to GitHub</p>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
